<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kirim Email</title>
</head>
<body>
    <h1>Form Kirim Email</h1>
    <form action="latihan68.html">
    Nama:
    <br>
    <input type="text" name="nama" placeholder="Nama lengkap">
    <br>
    Alamat:
    <br>
    <input type="text" name="address" placeholder="Alamat surat">
    <br>
    Email:
    <br>
    <input type="text" name="email" placeholder="Alamat email">
    <br>
    Pesan:
    <br>
    <textarea name="pesan" id="pesan" cols="100" rows="10"></textarea>
    <br>
    <button type="submit">Kirim</button>
    <button type="reset">Reset</button>
    </form>
</body>
</html>
