<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SMK To-Do List</title>
    <style>
        body {
        font-family: Arial, Helvetica, sans-serif;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        }

        .container {
        background: white;
        padding: 20px;
        width: 350px;
        border-radius: 12px;
        }

        h2 {
        text-align: center;
        color: purple;
        }

        .input-group {
        display: flex;
        gap: 5px;
        }

        input {
        flex: 1;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        }

        button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        }

        .btn-add {
        background: purple;
        color: white;
        }

        .btn-delete {
        background: red;
        color: white;
        font-size: 12px;
        }

        ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
        }

        li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #eee;
        }

        .footer {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 14px;
        }

        .btn-clear {
        background: transparent;
        border: 1px solid red;
        color: red;
        }
    </style>
</head>
<body>

    <div class="container">
    <h2>Tugas Mandiri</h2>

    <div class="input-group">
        <input type="text" id="inputTugas" placeholder="tugasnya">
        <button class="btn-add" onclick="tambahTugas()">Tambah</button>
    </div>

    <ul id="listTugas"></ul>

    <div class="footer">
        <span id="total">Total: 0 tugas</span>
        <button class="btn-clear" onclick="hapusSemua()">Hapus Semua</button>
    </div>
    </div>

<script>
    let data = JSON.parse(localStorage.getItem("data")) || [];

    tampilkanTugas();

    function tambahTugas() {
        let input = document.getElementById("inputTugas");
        let tugas = input.value.trim();

        if (tugas === "") return;

        data.push(tugas);
        localStorage.setItem("data", JSON.stringify(data));

        input.value = "";
        tampilkanTugas();
    }

    function tampilkanTugas() {
        let list = document.getElementById("listTugas");
        let total = document.getElementById("total");

        list.innerHTML = "";

        data.forEach((tugas, index) => {
        let li = document.createElement("li");

        li.innerHTML = `
            ${tugas}
            <button class="btn-delete" onclick="hapusTugas(${index})">X</button>
        `;

        list.appendChild(li);
        });

        total.textContent = "Total: " + data.length + " tugas";
    }

    function hapusTugas(index) {
        data.splice(index, 1);
        localStorage.setItem("data", JSON.stringify(data));
        tampilkanTugas();
    }

    function hapusSemua() {
        localStorage.removeItem("data");
        data = [];
        tampilkanTugas();
    }
</script>

</body>
</html>
